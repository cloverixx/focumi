<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Focumi — Dashboard</title>
  <meta name="description" content="Focumi — Small efforts today, big results tomorrow" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/img/favicon.png">
  <style>
    #ambience-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -9;
      pointer-events: none;
    }
    #parallax-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -10;
      background: linear-gradient(135deg, #f5f7ff, #eaf3ff);
      pointer-events: none;
    }
    #moodModal { 
      display: none; 
    }
    .focus-room { 
      display: none; 
    }
  </style>
</head>
<body class="theme-pastel" id="body-root">
  <div id="parallax-bg"></div>
  <canvas id="ambience-canvas"></canvas>
  <header class="topbar">
    <div class="d-flex align-items-center" style="position:relative;">
      <div class="brand">
        <a href="index.html">
          <img src="assets/img/focumi-100.png" alt="Focumi logo" class="brand-logo" width="28" height="28">
          Focumi <span class="beta">Productivity</span>
        </a>
      </div>

      <div id="mobileMenu" class="mobile-menu" style="display:none;"></div>

      <div class="mobile-actions d-flex align-items-center ms-3">
        <button id="menuToggle" class="btn btn-icon" aria-expanded="false" aria-controls="mobileMenu" title="Menu">
          <i class="fas fa-bars"></i>
        </button>
        <button id="open-focus-room" class="btn btn-sm btn-primary ms-2 mobile-focus-btn" title="Focus Room">Focus Room</button>
      </div>
    </div>
    <div class="top-actions d-flex align-items-center">
      <div class="feature-toggles d-flex gap-1">
        <button class="btn btn-icon feature-btn" data-target="todo"><i class="fas fa-check-square"></i></button>
        <button class="btn btn-icon feature-btn" data-target="wheel"><i class="fas fa-bullseye"></i></button>
        <button class="btn btn-icon feature-btn" data-target="pomodoro"><i class="fas fa-clock"></i></button>
        <button class="btn btn-icon feature-btn" data-target="notes"><i class="fas fa-sticky-note"></i></button>
        <button class="btn btn-icon feature-btn" data-target="music"><i class="fas fa-music"></i></button>
        <button class="btn btn-icon feature-btn" data-target="mood"><i class="fas fa-smile"></i></button>
        <button class="btn btn-icon feature-btn" data-target="quotes"><i class="fas fa-quote-right"></i></button>
        <button class="btn btn-icon feature-btn" data-target="dashboard"><i class="fas fa-chart-line"></i></button>
        <button class="btn btn-icon feature-btn" data-target="calendar"><i class="fas fa-calendar-alt"></i></button>
      </div>
      <div class="controls d-flex">
        <select id="themePicker" class="form-select form-select-sm me-2">
          <option value="pastel">Pastel Study</option>
          <option value="minimal">Minimal White</option>
          <option value="matrix">Dark Matrix</option>
          <option value="glass">Glassmorphism</option>
        </select>
        <select id="ambiencePicker" class="form-select form-select-sm me-2">
          <option value="none">Ambience: None</option>
          <option value="snow">Ambience: Snow</option>
          <option value="rain">Ambience: Rain</option>
        </select>
      </div>
    </div>
  </header>
  <main class="container-fluid mt-3 mb-5">
    <section id="workspace">
      <div class="widget" id="todo" draggable="true" style="display:none;">
        <div class="widget-head"><h4>To-Do List</h4></div>
        <div class="widget-body">
          <div class="d-flex gap-2 mb-2">
            <input id="todoText" class="form-control" placeholder="Tulis tugas...">
            <select id="todoCat" class="form-select w-auto">
              <option>Belajar</option><option>Kerja</option><option>Pribadi</option>
            </select>
            <button id="addTodo" class="btn btn-primary">Tambah</button>
          </div>
          <div id="todoList"></div>
        </div>
      </div>
      <div class="widget" id="pomodoro" draggable="true" style="display:none;">
        <div class="widget-head"><h4>Pomodoro</h4></div>
        <div class="widget-body">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <div class="pomo-display" id="pomoDisplay">25:00</div>
            <div>
              <button id="pomoStart" class="btn btn-sm btn-success me-1">Start</button>
              <button id="pomoPause" class="btn btn-sm btn-warning me-1">Pause</button>
              <button id="pomoReset" class="btn btn-sm btn-secondary">Reset</button>
            </div>
          </div>
          <div class="mb-2">
            <div class="pomo-templates" id="pomoTemplates">
              <button class="pomo-template" data-min="25" data-break="5">25 / 5</button>
              <button class="pomo-template" data-min="50" data-break="10">50 / 10</button>
              <button class="pomo-template" data-min="45" data-break="15">45 / 15</button>
              <div id="pomoCustom" class="d-flex gap-2 align-items-center" style="margin-left:8px;">
                <input id="pomoCustomFocus" type="number" min="1" class="form-control form-control-sm w-auto" placeholder="Focus min" value="25" style="width:80px;">
                <input id="pomoCustomBreak" type="number" min="0" class="form-control form-control-sm w-auto" placeholder="Break min" value="5" style="width:80px;">
                <button id="pomoCustomApply" class="btn btn-sm btn-outline-primary">Apply</button>
              </div>
            </div>
            <div class="small text-muted mt-2" id="pomoNote"></div>
          </div>
          <canvas id="pomoStats" height="100"></canvas>
        </div>
      </div>
      <div class="widget" id="notes" draggable="true" style="display:none;">
        <div class="widget-head"><h4>Notes</h4></div>
        <div class="widget-body">
          <div id="notesArea" class="notes-area"></div>
          <div class="mt-2 d-flex gap-2">
            <button id="addNote" class="btn btn-sm btn-outline-primary">Tambah Note</button>
            <button id="exportNotes" class="btn btn-sm btn-outline-secondary">Export PNG</button>
          </div>
        </div>
      </div>
      <div class="widget" id="music" draggable="true" style="display:none;">
        <div class="widget-head"><h4>Music</h4></div>
        <div class="widget-body">
          <div class="d-flex gap-2 align-items-center">
            <select id="musicSelect" class="form-select w-auto">
              <option value="">None</option>
              <option value="music_1">One Direction - One Thing</option>
              <option value="music_2">Taylor Swift - You're On Your Own, Kid</option>
              <option value="music_3">Justin Bieber - Love Yourself</option>
              <option value="music_4">A Sorrowful Reunion - Reality Club</option>
              <option value="music_5">Jonas Blue – Rise ft. Jack & Jack</option>
            </select>
            <button id="musicPlay" class="btn btn-sm btn-outline-primary">Play</button>
            <input id="musicVol" type="range" min="0" max="1" step="0.01" value="0.6" class="form-range w-25 ms-2">
          </div>
          <canvas id="musicEQ" height="40" class="mt-2 w-100"></canvas>
        </div>
      </div>
      <div class="widget" id="wheel" draggable="true" style="display:none;">
        <div class="widget-head"><h4>Random Wheel</h4></div>
        <div class="widget-body">
          <div class="wheel-wrap">
            <canvas id="wheelCanvas" width="240" height="240"></canvas>
          </div>
          <div class="mt-2 text-center">
            <button id="spinWheel" class="btn btn-sm btn-primary">Spin</button>
          </div>
        </div>
      </div>
      <div class="widget" id="mood" draggable="true" style="display:none;">
        <div class="widget-head"><h4>Mood Tracker</h4></div>
        <div class="widget-body">
          <canvas id="moodChart" height="80"></canvas>
          <div class="mt-2">
            <button class="mood-btn btn btn-sm btn-outline-secondary" data-mood="5">😄</button>
            <button class="mood-btn btn btn-sm btn-outline-secondary" data-mood="4">😊</button>
            <button class="mood-btn btn btn-sm btn-outline-secondary" data-mood="3">😐</button>
            <button class="mood-btn btn btn-sm btn-outline-secondary" data-mood="2">😔</button>
            <button class="mood-btn btn btn-sm btn-outline-secondary" data-mood="1">😡</button>
          </div>
        </div>
      </div>
      <div class="widget" id="quotes" draggable="true" style="display:none;">
        <div class="widget-head"><h4>Motivation Quotes</h4></div>
        <div class="widget-body">
          <div id="quoteBox" class="small text-muted"></div>
          <div class="mt-2">
            <button id="inspire" class="btn btn-sm btn-outline-primary">Inspire</button>
          </div>
        </div>
      </div>
      <div class="widget" id="dashboard" draggable="true" style="display:none;">
        <div class="widget-head"><h4>Dashboard</h4></div>
        <div class="widget-body">
          <div class="d-flex gap-3">
            <div><strong id="dash-focused">0</strong><div class="small text-muted">Focused (mins)</div></div>
            <div><strong id="dash-done">0</strong><div class="small text-muted">Done</div></div>
            <div><strong id="dash-habit">0</strong><div class="small text-muted">Mood entries</div></div>
          </div>
          <div class="mt-3">
            <canvas id="dashBar" height="80"></canvas>
          </div>
          <div class="mt-2">
            <canvas id="dashPie" height="80"></canvas>
          </div>
        </div>
      </div>
      <div class="widget" id="calendar" draggable="true" style="display:none;">
        <div class="widget-head d-flex align-items-center justify-content-between">
          <h4>Mini Calendar</h4>
          <div>
            <button id="calPrev" class="btn btn-sm btn-light"><i class="fas fa-chevron-left"></i></button>
            <span id="calLabel" class="mx-2 fw-semibold"></span>
            <button id="calNext" class="btn btn-sm btn-light"><i class="fas fa-chevron-right"></i></button>
          </div>
        </div>
        <div class="widget-body">
          <div id="calendarGrid" class="calendar-grid mt-2"></div>
          <div class="mt-3 d-flex gap-2">
            <div class="flex-grow-1">
              <div class="small text-muted">Events on selected day:</div>
              <ul id="eventList" class="list-group mt-1"></ul>
            </div>
            <div style="width: 180px;">
              <button id="addEventBtn" class="btn btn-sm btn-primary w-100 mb-2">Tambah Event</button>
              <button id="clearEventsBtn" class="btn btn-sm btn-outline-danger w-100">Hapus Semua</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="focusRoom" class="focus-room">
    <div class="focus-inner text-center">
      <div id="focusTimer" class="focus-timer">25:00</div>
      <button id="exitFocus" class="btn btn-light mt-3">Exit</button>
    </div>
  </div>
  <div id="moodModal">
    <div class="modal-content small-modal">
      <h5 class="mb-2">How are you feeling now?</h5>
      <div class="d-flex gap-2 justify-content-center my-2">
        <button class="modal-mood-btn btn btn-outline-primary" data-mood="5">😄</button>
        <button class="modal-mood-btn btn btn-outline-primary" data-mood="4">😊</button>
        <button class="modal-mood-btn btn btn-outline-primary" data-mood="3">😐</button>
        <button class="modal-mood-btn btn btn-outline-primary" data-mood="2">😔</button>
        <button class="modal-mood-btn btn btn-outline-primary" data-mood="1">😡</button>
      </div>
      <button id="skipMood" class="btn btn-sm btn-outline-secondary w-100">Lewati</button>
    </div>
  </div>
  <div id="eventModal" class="modal-backdrop" style="display:none;">
    <div class="modal-content small-modal" style="width: 360px; margin: 60px auto; position: relative;">
      <h5 id="eventModalTitle" class="mb-2">Tambah Event</h5>
      <div class="mb-2">
        <label class="form-label small">Tanggal</label>
        <input id="eventDate" class="form-control" type="date">
      </div>
      <div class="mb-2">
        <label class="form-label small">Waktu (opsional)</label>
        <input id="eventTime" class="form-control" type="time">
      </div>
      <div class="mb-2">
        <label class="form-label small">Judul</label>
        <input id="eventTitle" class="form-control" type="text" placeholder="Contoh: Belajar Matematika">
      </div>
      <div class="d-flex gap-2">
        <button id="saveEventBtn" class="btn btn-primary flex-grow-1">Simpan</button>
        <button id="cancelEventBtn" class="btn btn-outline-secondary">Batal</button>
      </div>
    </div>
  </div>
  <div id="quoteModal" class="quote-modal" style="display:none;">
    <div class="quote-content">
      <div id="quoteText" class="quote-text"></div>
      <div class="mt-3 d-flex justify-content-center">
        <button id="closeQuote" class="btn btn-sm btn-outline-secondary">Tutup</button>
      </div>
    </div>
  </div>
  <footer class="footer muted">Focumi • Cloverixx Team</footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
